[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "otter0key-pii_masking_restore_signature_match"
version = "0.1.0"
description = "通过字符级与结构级特征识别OCR 文档理解工程师·敏感信息的脱敏与回填的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "otter0key" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://otter0key.github.io"
Repository = "https://github.com/otter0key/pii_masking_restore_signature_match"
Issues = "https://github.com/otter0key/pii_masking_restore_signature_match/issues"

[project.scripts]
pii_masking_restore_signature_match = "pii_masking_restore_signature_match:main"

[tool.setuptools]
py-modules = ["pii_masking_restore_signature_match"]
